name: Scrollow
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Scrollow:
    type: application
    platform: iOS
    sources:
      - Scrollow
    dependencies:
      - target: ShieldConfigExtension
      - target: DeviceActivityExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Scrollow
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Scrollow/Info.plist
        CODE_SIGN_ENTITLEMENTS: Scrollow/Scrollow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShieldConfigExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfigExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Scrollow.ShieldConfig
        INFOPLIST_FILE: ShieldConfigExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfigExtension/ShieldConfigExtension.entitlements
  DeviceActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - DeviceActivityExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Scrollow.DeviceActivity
        INFOPLIST_FILE: DeviceActivityExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityExtension/DeviceActivityExtension.entitlements
